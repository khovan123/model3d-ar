name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: node --check scripts/usdz-worker.mjs
      - run: python -m py_compile scripts/blender/source_to_glb.py scripts/blender/glb_to_usd.py
      - run: npm run lint
      - run: npm run build
